<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Emergency Access - Life Connect</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #1e293b;
      padding: 28px;
      border-radius: 24px;
      border: 1px solid rgba(225, 29, 72, 0.3);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px 0; font-weight: 800; color: #ffffff; }
    p { font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; line-height: 1.5; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-amb { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-sos { background: linear-gradient(135deg, #e11d48, #be123c); }
    .btn-reload { background: #334155; margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. You can still reach emergency medical services immediately using the direct quick-dial buttons below:</p>

    <div class="btn-group">
      <a href="tel:108" class="btn btn-amb">
        <span>🚑</span> Call 108 (Ambulance - Free 24x7)
      </a>
      <a href="tel:112" class="btn btn-sos">
        <span>🚨</span> Call 112 (National Emergency)
      </a>
      <button onclick="window.location.reload()" class="btn btn-reload">
        🔄 Check Connection & Reload
      </button>
    </div>
  </div>
</body>
</html>
